services:
  kafka:
    image: 'apache/kafka:latest'
    ports:
      - '9092:9092'
      - '9093:9093'
    volumes:
      - kafka_data:/var/lib/kafka
    environment:
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_NODE_ID=0
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
  postgres:
    image: postgres:17.6
    restart: on-failure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    mem_limit: 512m
  redis:
    image: redis:8.2.1
    restart: on-failure
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
#    networks:
#      - keycloak_net
  keycloak:
#    build:
#      context: .
#      dockerfile: DockerfileKeycloak
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev
    restart: on-failure
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
#      KC_DB_URL_HOST: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: root
    depends_on:
      - postgres
    links:
      - "postgres:postgres"
    volumes:
      - ./providers/keycloakplugin-0.0.1-SNAPSHOT-plain.jar:/opt/keycloak/providers/keycloakplugin-0.0.1-SNAPSHOT-plain.jar:ro
#    networks:
#      - keycloak_net
volumes:
  postgres_data:
  redis_data:
  kafka_data:
