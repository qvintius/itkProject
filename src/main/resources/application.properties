spring.application.name=itkProj
server.port=8080

server.servlet.context-path=/api
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

topic.tasks=tasks
topic.appointExecutor=appointExecutor

cache.prefix.people=people
cache.prefix.tasks=tasks
cache.ttl=3

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

#security oauth2
#github
#logging.level.org.springframework.security=TRACE
spring.security.oauth2.client.registration.github.client-id=${github.client-id}
spring.security.oauth2.client.registration.github.client-secret=${github.client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
#google
spring.security.oauth2.client.registration.google.client-id=${google.client}
spring.security.oauth2.client.registration.google.client-secret=${google.client-secret}
