plugins {
    id 'java'
    id 'java-library'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

description = 'itkProj'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
group = 'mainpackage'
version = '0.0.1-SNAPSHOT'
repositories {
    mavenCentral()
}


dependencies {
    implementation project(':securityService')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'



    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    implementation 'org.springframework.boot:spring-boot-starter-aspectj:4.1.0'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.4'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.4'
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations:2.21'
//    implementation 'org.springframework.boot:spring-boot-starter-security'

    compileOnly 'org.modelmapper:modelmapper:3.2.6'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
